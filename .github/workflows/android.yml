name: Android CI

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew assemble

      - name: Check signing secrets
        id: check_secrets
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ilharp/sign-android-release@v2
        name: Sign app APK
        id: sign_app
        if: steps.check_secrets.outputs.has_secrets == 'true'
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload signed release artifacts
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: impad.pro-release apk
          path: app/build/outputs/apk/release/*signed.apk

      - name: Upload unsigned release artifacts
        if: steps.check_secrets.outputs.has_secrets == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: impad.pro-release-unsigned apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: impad.pro-debug apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Auto-publish Release
        if: steps.check_secrets.outputs.has_secrets == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          gh release create "$TAG" \
            --title "impad pro $TAG" \
            --notes "自动发布：覆盖 11 个宿主应用平板登录。只发布签名 APK，可直接安装。"
          # 用应用名命名，只发行签名版
          SIGNED=$(ls app/build/outputs/apk/release/*signed.apk | head -1)
          echo "signed apk: $SIGNED"
          test -n "$SIGNED"
          gh release upload "$TAG" "$SIGNED#impad.pro-${VERSION}-release.apk"

  build_zygisk:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust (stable, Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install Android NDK
        run: |
          NDK_VERSION=30.0.14904198
          MIN_SDK=28
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null 2>&1 || true
          NDK_BIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/aarch64-linux-android$MIN_SDK-clang"
          test -x "$NDK_BIN/armv7a-linux-androideabi$MIN_SDK-clang"

      - name: Build native (both ABIs)
        run: |
          # 写 .cargo/config.toml（CI 的 NDK 路径不同于 NAS 本地）
          NDK_VERSION=30.0.14904198
          MIN_SDK=28
          NDK_BIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > impad-zygisk/native/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          ar = "$NDK_BIN/llvm-ar"
          linker = "$NDK_BIN/aarch64-linux-android$MIN_SDK-clang"
          [target.armv7-linux-androideabi]
          ar = "$NDK_BIN/llvm-ar"
          linker = "$NDK_BIN/armv7a-linux-androideabi$MIN_SDK-clang"
          [env]
          CC_aarch64_linux_android = "$NDK_BIN/aarch64-linux-android$MIN_SDK-clang"
          CXX_aarch64_linux_android = "$NDK_BIN/aarch64-linux-android$MIN_SDK-clang++"
          AR_aarch64_linux_android = "$NDK_BIN/llvm-ar"
          CC_armv7_linux_androideabi = "$NDK_BIN/armv7a-linux-androideabi$MIN_SDK-clang"
          CXX_armv7_linux_androideabi = "$NDK_BIN/armv7a-linux-androideabi$MIN_SDK-clang++"
          AR_armv7_linux_androideabi = "$NDK_BIN/llvm-ar"
          EOF
          cd impad-zygisk/native
          cargo build --release --target aarch64-linux-android
          cargo build --release --target armv7-linux-androideabi

      - name: Download APK for payload
        uses: actions/download-artifact@v4
        with:
          name: impad.pro-release apk
          path: apk-artifacts
        continue-on-error: true

      - name: Package Zygisk module ZIP
        run: |
          cd "$GITHUB_WORKSPACE"
          APK=$(find apk-artifacts -name "*signed.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          fi
          echo "payload APK: $APK"
          test -n "$APK"
          # 打包脚本引用 NAS 路径，CI 上直接用参数传 APK 路径
          chmod +x impad-zygisk/build-module.sh
          ./impad-zygisk/build-module.sh "$(pwd)/$APK"

      - name: Upload Zygisk module
        uses: actions/upload-artifact@v4
        with:
          name: impad-zygisk
          path: impad-zygisk/release/*.zip
          if-no-files-found: error

      - name: Attach Zygisk module to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ZIP=$(ls impad-zygisk/release/*.zip | head -1)
          VERSION="${TAG#v}"
          echo "zygisk zip: $ZIP"
          test -n "$ZIP"
          gh release upload "$TAG" "$ZIP#impad.pro-zygisk-${VERSION}.zip" --clobber || true
